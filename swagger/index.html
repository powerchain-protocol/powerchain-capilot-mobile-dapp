<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PowerChain Copilot API · Swagger</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>body{margin:0;background:#f7f8f7}.topbar{display:none}.swagger-ui .info .title{color:#0e5a3b}.swagger-ui .btn.authorize{color:#0e5a3b;border-color:#0e5a3b}</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
window.onload=()=>SwaggerUIBundle({url:'/api/v1/openapi.yaml',dom_id:'#swagger-ui',deepLinking:true,displayRequestDuration:true,filter:true,persistAuthorization:false,tryItOutEnabled:false});
</script>
</body>
</html>
