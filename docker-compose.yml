services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-powerchain_copilot}
    ports:
      - "${POWERCHAIN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - powerchain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-powerchain_copilot}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  powerchain_postgres_data:
