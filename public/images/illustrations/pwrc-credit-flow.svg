<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="48" fill="#F8FAF8"/>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1D6B43"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0E3D28" flood-opacity="0.10"/></filter></defs>
  <text x="100" y="95" font-family="Arial" font-size="48" font-weight="700" fill="#10231A">PWRC Credit Kernel</text>
  <text x="100" y="140" font-family="Arial" font-size="23" fill="#617168">Integer accounting with verified settlement and append-only auditability</text>
  <g font-family="Arial">
    <rect x="100" y="220" width="300" height="170" rx="30" fill="white" stroke="#CBD8D0"/>
    <text x="145" y="270" font-size="22" font-weight="700" fill="#113D28">1. Deterministic Quote</text>
    <text x="145" y="310" font-size="19" fill="#65766C">10,000 PWRC / response</text>
    <text x="145" y="344" font-size="19" fill="#65766C">SHA-256 quote hash</text>
    <text x="145" y="378" font-size="19" fill="#65766C">9-decimal base units</text>

    <rect x="470" y="220" width="300" height="170" rx="30" fill="white" stroke="#CBD8D0"/>
    <text x="515" y="270" font-size="22" font-weight="700" fill="#113D28">2. Reserve</text>
    <text x="515" y="310" font-size="19" fill="#65766C">available → reserved</text>
    <text x="515" y="344" font-size="19" fill="#65766C">user-scoped</text>
    <text x="515" y="378" font-size="19" fill="#65766C">expiry recoverable</text>

    <rect x="840" y="220" width="300" height="170" rx="30" fill="white" stroke="#CBD8D0"/>
    <text x="885" y="270" font-size="22" font-weight="700" fill="#113D28">3. Copilot Response</text>
    <text x="885" y="310" font-size="19" fill="#65766C">credits context grounded</text>
    <text x="885" y="344" font-size="19" fill="#65766C">provider call</text>
    <text x="885" y="378" font-size="19" fill="#65766C">failure releases reserve</text>

    <rect x="1210" y="220" width="290" height="170" rx="30" fill="#113D28"/>
    <text x="1255" y="270" font-size="22" font-weight="700" fill="white">4. Settle Spend</text>
    <text x="1255" y="310" font-size="19" fill="#D7E7DD">reserved → spent</text>
    <text x="1255" y="344" font-size="19" fill="#D7E7DD">append-only ledger</text>
    <text x="1255" y="378" font-size="19" fill="#D7E7DD">idempotent</text>
  </g>
  <line x1="400" y1="305" x2="455" y2="305" stroke="#1D6B43" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="770" y1="305" x2="825" y2="305" stroke="#1D6B43" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1140" y1="305" x2="1195" y2="305" stroke="#1D6B43" stroke-width="4" marker-end="url(#arr)"/>

  <g font-family="Arial">
    <rect x="100" y="485" width="1400" height="285" rx="32" fill="white" stroke="#CBD8D0"/>
    <text x="150" y="540" font-size="24" font-weight="700" fill="#113D28">PWRC Solana Pay top-up</text>
    <rect x="150" y="585" width="250" height="105" rx="22" fill="#EFF6F1"/>
    <rect x="470" y="585" width="250" height="105" rx="22" fill="#EFF6F1"/>
    <rect x="790" y="585" width="250" height="105" rx="22" fill="#EFF6F1"/>
    <rect x="1110" y="585" width="320" height="105" rx="22" fill="#E3F0E7"/>
    <text x="190" y="628" font-size="20" font-weight="700" fill="#1D6B43">Payment Intent</text><text x="190" y="661" font-size="17" fill="#63746A">recipient + reference</text>
    <text x="510" y="628" font-size="20" font-weight="700" fill="#1D6B43">Wallet Transfer</text><text x="510" y="661" font-size="17" fill="#63746A">Token-2022 PWRC</text>
    <text x="830" y="628" font-size="20" font-weight="700" fill="#1D6B43">Payment Kernel</text><text x="830" y="661" font-size="17" fill="#63746A">payment.settled verified</text>
    <text x="1150" y="628" font-size="20" font-weight="700" fill="#1D6B43">Credit Account Funded</text><text x="1150" y="661" font-size="17" fill="#63746A">only after verified settlement</text>
  </g>
  <line x1="400" y1="637" x2="455" y2="637" stroke="#1D6B43" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="720" y1="637" x2="775" y2="637" stroke="#1D6B43" stroke-width="4" marker-end="url(#arr)"/>
  <line x1="1040" y1="637" x2="1095" y2="637" stroke="#1D6B43" stroke-width="4" marker-end="url(#arr)"/>
  <text x="100" y="835" font-family="Arial" font-size="18" fill="#67776E">Invariant: the mobile client never grants itself credit. Server-side verified settlement is authoritative.</text>
</svg>
